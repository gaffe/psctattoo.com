version: 1

env:
  variables:
    HUGO_VERSION: "0.168.0"

frontend:
  phases:
    build:
      commands:
        - curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
        - tar -xzf hugo.tar.gz
        - ./hugo version
        - ./hugo --minify
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
